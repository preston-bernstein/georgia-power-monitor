name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    uses: preston-bernstein/ci-workflows/.github/workflows/python.yml@v1
    with:
      python-versions: '["3.12"]'
      install: pip install -e ".[dev]"
      lint: ruff check .
      test: pytest -q
    secrets:
      # Two private siblings, fleet-logging and scraper-commons, so the secret
      # holds both keys. webfactory/ssh-agent picks the right one per repo from
      # each key's comment, which is the literal clone URL.
      ssh-private-key: ${{ secrets.FLEET_LOGGING_DEPLOY_KEY }}

  workflows:
    uses: preston-bernstein/ci-workflows/.github/workflows/actions-lint.yml@v1
